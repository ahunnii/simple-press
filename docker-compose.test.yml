# Throwaway Postgres for integration tests. Data lives in a tmpfs (RAM) and is
# wiped on `down` — it is purely ephemeral.
#
#   pnpm test:db:up     # start
#   pnpm test           # run the suite
#   pnpm test:db:down   # stop + remove
#
# The host port defaults to 5436 and is overridable via TEST_PG_PORT. It used to
# be hard-coded to 5433, which turned out not to be reliably free — when another
# project's Postgres holds that port, the test DSN still looks correct while
# actually addressing a stranger's server, and global-setup.ts runs
# `prisma db push --accept-data-loss` through it. TEST_PG_PORT is read here, in
# tests/helpers/test-env.ts, and in scripts/e2e-pg.sh, so the container and the
# DSN cannot drift apart. tests/helpers/assert-test-database.ts is the backstop
# if they ever do.
services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: simplepress_test
    ports:
      - "${TEST_PG_PORT:-5436}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d simplepress_test"]
      interval: 2s
      timeout: 3s
      retries: 20
