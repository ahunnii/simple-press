# Throwaway Postgres for integration tests. Runs on 5433 so it never collides
# with a local dev database on 5432. Data lives in a tmpfs (RAM) and is wiped on
# `down` — it is purely ephemeral.
#
#   pnpm test:db:up     # start
#   pnpm test           # run the suite
#   pnpm test:db:down   # stop + remove
services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: simplepress_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d simplepress_test"]
      interval: 2s
      timeout: 3s
      retries: 20
